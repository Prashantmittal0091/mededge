services:
  - type: web
    name: mededge-intelligence
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mededge-db
          property: connectionString

databases:
  - name: mededge-db
    databaseName: mededgedb
    user: mededge_user
    plan: free
